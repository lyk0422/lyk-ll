org.gradle.caching=true
# Windows 中文环境下，测试 worker 的 @argfile 由 Gradle 按默认字符集写入、
# 而 java 启动器按平台 ANSI(GBK) 解码；路径含中文时须保持一致，否则 worker 找不到 GradleWorkerMain。
# 源码编译编码仍由 build.gradle 中 JavaCompile.options.encoding=UTF-8 保证。
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=GBK -Dsun.jnu.encoding=GBK
org.gradle.daemon=false
