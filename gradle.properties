org.gradle.caching=true
# Windows 简体中文环境下，JVM launcher 按系统码页(GBK)读取 @argfile；
# 当工程路径或 GRADLE_USER_HOME 含中文时，需让 Gradle 守护进程以相同码页写出 argfile，
# 否则测试 worker 类路径会因 UTF-8/GBK 解读不一致而损坏（GradleWorkerMain 找不到）。
# Java 编译与 SQL 初始化均在各自配置中显式指定 UTF-8，不受此默认字符集影响。
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=GBK -Dsun.jnu.encoding=GBK
org.gradle.daemon=false
