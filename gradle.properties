org.gradle.caching=true
# 工作目录含中文：Gradle 守护进程用 JVM 默认字符集（file.encoding）写 worker @argfile，
# 而 java 启动器在任何 -D 生效前按系统区域编码（中文 Windows 为 GBK）读取，二者必须一致，
# 否则 classpath 中的中文路径乱码导致 GradleWorkerMain ClassNotFoundException。
# 业务资源（schema.sql 等）通过 spring.sql.init.encoding=UTF-8 显式解码，不受此默认值影响。
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=GBK
org.gradle.daemon=false
