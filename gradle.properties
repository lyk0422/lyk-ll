org.gradle.caching=true
# Windows 中文版（系统 ANSI 代码页 GBK）+ 含中文的工作区路径：JDK 的 @argfile 固定以系统
# ANSI 代码页解码，Gradle daemon 需以 GBK 作为默认字符集生成 worker 命令行参数文件，
# 否则测试 worker 会因 classpath 中文路径乱码而找不到 GradleWorkerMain。
# Java 编译显式使用 options.encoding=UTF-8，业务源码与资源不受此设置影响。
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=GBK -Dsun.jnu.encoding=GBK
org.gradle.daemon=false
