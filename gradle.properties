org.gradle.caching=true
# file.encoding=COMPAT：使 Gradle 守护进程以平台字符集(本机为 GBK)写 worker 启动参数文件。
# 本工程路径含非 ASCII 字符，若守护进程默认 UTF-8 而 JDK 启动器按平台字符集解析参数文件，
# 测试 worker 会因类路径乱码报 ClassNotFoundException: GradleWorkerMain。
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=COMPAT -Dfile.encoding=COMPAT
org.gradle.daemon=false
