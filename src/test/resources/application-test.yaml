spring:
  datasource:
    url: jdbc:h2:mem:quarantine_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8
