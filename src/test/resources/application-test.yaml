spring:
  datasource:
    # 测试使用独立命名的 H2 内存库（MySQL 兼容模式），与本地文件库隔离
    url: jdbc:h2:mem:forwarder_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always

forwarder:
  capacity: 1000
  in-flight-timeout-ms: 30000
  flush-batch-size: 100
  flush-interval-ms: 60000
