spring:
  datasource:
    # 测试使用独立的命名内存库，场景间通过清表保证隔离
    url: jdbc:h2:mem:spectrum_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  sql:
    init:
      mode: always

spectrum:
  lease:
    shared-eirp-limit-mw: 1000
