spring:
  datasource:
    url: jdbc:h2:mem:heating_net_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      mode: always

server:
  error:
    include-message: always
