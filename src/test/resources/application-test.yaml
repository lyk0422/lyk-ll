spring:
  datasource:
    # 测试使用独立命名内存库，与本地运行库隔离；H2 MySQL 兼容模式，随 JVM 退出消失
    url: jdbc:h2:mem:ros_config_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

# 测试中缩短节点校验时限，加速超时回滚用例
ros:
  node:
    validation-timeout-ms: 300
