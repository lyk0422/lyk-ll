spring:
  sql:
    init:
      mode: embedded
      schema-locations: classpath:db/schema.sql
  datasource:
    url: jdbc:h2:mem:rosbridge_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

rosbridge:
  grace-period-ms: 1000
  service-timeout-ms: 300
  default-rate-per-second: 1000
  default-queue-capacity: 64
  ledger-capacity: 256
  synthetic-tick-interval-ms: 0
