spring:
  datasource:
    # 测试使用独立命名的 H2 内存库（MySQL 兼容），与本地运行库隔离
    url: jdbc:h2:mem:ros_registry_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
