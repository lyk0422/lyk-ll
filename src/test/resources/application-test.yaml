# 隔离测试配置：独立命名的 H2 内存库（MySQL 兼容模式），不依赖任何外部数据库。
spring:
  datasource:
    url: jdbc:h2:mem:refresh_token_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  sql:
    init:
      mode: embedded

refresh-tokens:
  derivation-key: unit-test-synthetic-key
  default-ttl-seconds: 3600
