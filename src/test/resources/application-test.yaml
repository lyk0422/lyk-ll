spring:
  datasource:
    # 测试专用命名内存库（MySQL 兼容模式），随 JVM 退出释放
    url: jdbc:h2:mem:tf2_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1

tf2:
  cache:
    # 测试使用 1000ns 小窗口，便于验证窗口淘汰
    window-nanos: 1000
