spring:
  datasource:
    url: jdbc:h2:mem:trial_it;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC
