# 测试环境：独立命名的 H2 内存库（MySQL 兼容模式），不依赖外部 MySQL
spring:
  datasource:
    url: jdbc:h2:mem:audit_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8

# 测试中阶段不 sleep，加快执行；并发窗口由真实并发与唯一约束裁决
audit:
  step-delay-millis: 0
