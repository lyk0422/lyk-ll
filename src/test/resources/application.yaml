spring:
  datasource:
    # 测试使用独立的命名内存库，与本地演示库隔离；JVM 退出后数据消失。
    url: jdbc:h2:mem:pension_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  # 允许固定测试时钟 Bean 覆盖生产时钟 Bean。
  main:
    allow-bean-definition-overriding: true
