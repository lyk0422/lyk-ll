spring:
  application:
    name: gitcangku1-test
  datasource:
    # 测试使用独立命名内存库，与本地运行库隔离
    url: jdbc:h2:mem:test_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
