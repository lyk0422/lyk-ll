# 测试专用配置：使用与本地运行隔离的 H2 命名内存库（MODE=MySQL）。
# 不设置 DB_CLOSE_DELAY=-1：测试上下文关闭、Hikari 连接释放后数据库即销毁。
spring:
  datasource:
    url: jdbc:h2:mem:ros2launch_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

orchestrator:
  plan-executor:
    async: false
