spring:
  datasource:
    # 测试使用独立命名内存库，与本地运行库隔离；JVM 退出即释放
    url: jdbc:h2:mem:costmap_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      mode: always
