# 测试专用配置：独立命名的 H2 内存库（MySQL 兼容模式），不依赖任何外部数据库。
spring:
  datasource:
    url: jdbc:h2:mem:dr_tests;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  main:
    allow-bean-definition-overriding: true
