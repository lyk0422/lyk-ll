spring:
  application:
    name: gitcangku1-test
  datasource:
    # 测试专用命名内存库（MySQL 兼容模式）；不加 DB_CLOSE_DELAY，
    # 连接池随测试上下文关闭后数据库自动释放。
    url: jdbc:h2:mem:test_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC

server:
  port: 0
