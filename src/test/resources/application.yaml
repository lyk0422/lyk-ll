spring:
  application:
    name: gitcangku1-test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 0

app:
  expiry:
    # 测试环境关闭自动巡检，避免干扰用例；到期逻辑由用例显式触发
    scheduler-enabled: false
