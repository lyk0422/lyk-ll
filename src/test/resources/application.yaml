spring:
  datasource:
    url: jdbc:h2:mem:test_cosmetic;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: embedded
      encoding: UTF-8

cosmetic:
  public-notice:
    scheduling-enabled: false
  children-public-notice:
    scheduling-enabled: false
