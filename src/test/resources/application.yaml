spring:
  datasource:
    # 测试使用独立命名内存库，与本地默认库隔离；场景间通过 @Sql 或 JdbcTemplate 清表避免顺序依赖
    url: jdbc:h2:mem:slam_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always

slam:
  loop:
    score-min: 0.75
    residual-max: 0.5
    covariance-trace-max: 1.0
  opt:
    concurrency: 4
    # 测试默认关闭自动派发，由用例显式 drainQueue 控制任务领取时机
    auto-dispatch: false
