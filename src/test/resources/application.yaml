spring:
  datasource:
    url: jdbc:h2:mem:water_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  jackson:
    time-zone: UTC

server:
  error:
    include-message: always
