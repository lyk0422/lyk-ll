# 测试环境：独立命名内存库（MySQL 兼容），与本地运行库隔离；场景间由测试基类清表。
spring:
  datasource:
    url: jdbc:h2:mem:dispatch_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
  jackson:
    time-zone: UTC

server:
  error:
    include-message: always
    include-stacktrace: never

# 测试中放大扫描间隔，超时升级一律由用例显式调用 scanTimeouts 驱动
dispatch:
  timeout:
    scan-ms: 3600000
