spring:
  application:
    name: gitcangku1-test
  datasource:
    url: jdbc:h2:mem:port_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
