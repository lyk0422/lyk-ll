spring:
  application:
    name: gitcangku1
  datasource:
    url: jdbc:h2:mem:transfer_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 0

# 测试关闭定时扫描，改用可控时钟手动触发，保证 48 小时边界确定性
transfer:
  scanner:
    enabled: false
