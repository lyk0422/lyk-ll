spring:
  datasource:
    url: jdbc:h2:mem:dam_dispatch_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      mode: always
      encoding: UTF-8

dispatch:
  sweep:
    enabled: false
