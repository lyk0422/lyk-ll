spring:
  datasource:
    # 测试专用命名内存库；LOCK_TIMEOUT 放宽以容纳并发封账/入账测试中的行锁等待。
    url: jdbc:h2:mem:payment_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jackson:
    time-zone: UTC
