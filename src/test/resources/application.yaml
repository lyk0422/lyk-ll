spring:
  application:
    name: gitcangku1
  datasource:
    # 测试默认库；各集成测试类再用独立库名覆盖，避免上下文间相互影响
    url: jdbc:h2:mem:ili_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
