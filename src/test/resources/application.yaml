spring:
  datasource:
    # 测试独立命名内存库（MySQL 兼容模式），与本地运行库隔离；JVM 退出即释放。
    url: jdbc:h2:mem:wind_farm_dispatch_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      connection-timeout: 30000
  sql:
    init:
      mode: always
      encoding: UTF-8
