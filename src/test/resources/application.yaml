spring:
  datasource:
    url: jdbc:h2:mem:tunnel_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

app:
  ventilation:
    feedback-timeout-seconds: 60
    # 测试关闭自动扫描，改由用例用可控时钟手动触发，保证断言确定。
    scheduler-enabled: false
