# 测试环境：独立命名的 H2 MySQL 兼容内存库，随测试上下文启动自动建表并初始化合成目录。
spring:
  datasource:
    url: jdbc:h2:mem:epidemic_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC
