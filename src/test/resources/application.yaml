spring:
  datasource:
    url: jdbc:h2:mem:runway_service_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 1
      connection-timeout: 30000

runway:
  low-visibility-rvr-threshold: 550
  inspection-start-limit-minutes: 15
  friction-pass-threshold: 0.35
