spring:
  datasource:
    # 测试专用命名内存库，与本地默认库隔离；JVM 退出后数据自动消失
    url: jdbc:h2:mem:can_dbc_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
