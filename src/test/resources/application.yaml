spring:
  datasource:
    # 测试使用独立命名内存库（MySQL 兼容模式），与本地演示库隔离；
    # LOCK_TIMEOUT 提高到 30s，保证并发测试中行锁等待而非快速超时。
    url: jdbc:h2:mem:cutover_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

cutover:
  max-window-minutes: 240
  verification-timeout-minutes: 10
