spring:
  datasource:
    # 测试使用独立命名的 H2 内存库（MySQL 兼容模式），不依赖外部数据库
    url: jdbc:h2:mem:ros_param_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: never

ros:
  transaction:
    # 测试中使用较短时限，超时用例延迟 2s 即可快速触发
    timeout-ms: 500
