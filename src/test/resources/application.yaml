spring:
  application:
    name: gitcangku1-test
  datasource:
    # 测试专用命名内存库（MySQL 兼容模式），上下文关闭后随连接池释放
    url: jdbc:h2:mem:test_ledger;MODE=MySQL;DATABASE_TO_LOWER=TRUE
