spring:
  datasource:
    # 测试使用独立命名内存库（MySQL 兼容），与本地运行库隔离
    url: jdbc:h2:mem:calibration_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

calibration:
  seed:
    enabled: false
  orthogonality-tolerance: 0.01
