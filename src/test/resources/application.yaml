spring:
  application:
    name: water-intake-quota-test
  datasource:
    url: jdbc:h2:mem:water_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: UTC

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
