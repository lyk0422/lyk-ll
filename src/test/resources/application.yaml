spring:
  application:
    name: gitcangku1-test
  datasource:
    url: jdbc:h2:mem:window_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: classpath:test-seed.sql
  jackson:
    time-zone: UTC

server:
  error:
    include-message: never
    include-stacktrace: never
