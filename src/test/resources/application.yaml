spring:
  datasource:
    # 测试使用独立的命名内存库，与本地运行库隔离；JVM 退出即释放。
    url: jdbc:h2:mem:roaming_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      platform: h2
      encoding: UTF-8
  jackson:
    time-zone: UTC
