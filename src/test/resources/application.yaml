spring:
  application:
    name: gitcangku1-test
  datasource:
    url: jdbc:h2:mem:test_runway;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
