spring:
  datasource:
    # 测试使用独立命名的 H2 内存库（MySQL 兼容模式），随 JVM 退出释放
    url: jdbc:h2:mem:dr_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: embedded
  jackson:
    time-zone: UTC
