spring:
  datasource:
    # 测试使用独立的命名内存库；各测试类通过 @SpringBootTest properties 再指定不同库名避免相互干扰。
    url: jdbc:h2:mem:planning_scene_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
