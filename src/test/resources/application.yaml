spring:
  datasource:
    url: jdbc:h2:mem:cement_kiln_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

# 测试资源 application.yaml 会遮蔽主配置同名文件，业务参数在此显式给出（与主配置一致）
cement:
  max-substitution-rate: 0.40
  floor-substitution-rate: 0.10
  chlorine-limit-kg: 800.0
  sulfur-limit-kg: 15000.0
  command-confirm-timeout-minutes: 30
  consecutive-exceed-ban: 3
  command-timeout-scan-delay-ms: 3600000
  emission-limits:
    NOX: 400.0
    SO2: 200.0
    DUST: 30.0
  warm-up:
    curve-version: CURVE-2026A
    hold-timeout-hours: 4
    hold-timeout-scan-delay-ms: 3600000
    stages:
      - stage-no: 1
        target-temp: 600.0
        max-duration-minutes: 120
      - stage-no: 2
        target-temp: 1000.0
        max-duration-minutes: 180
      - stage-no: 3
        target-temp: 1450.0
        max-duration-minutes: 240
