spring:
  datasource:
    # 测试使用独立命名的内存库，与本地运行库隔离
    url: jdbc:h2:mem:gate_station_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
  jackson:
    time-zone: Asia/Shanghai
