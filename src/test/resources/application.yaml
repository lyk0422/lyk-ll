spring:
  datasource:
    # 测试专用命名内存库，与本地运行隔离
    url: jdbc:h2:mem:fishery_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  jackson:
    time-zone: UTC
