spring:
  datasource:
    # 测试专用命名内存库，与本地运行库隔离；JVM 退出后释放
    url: jdbc:h2:mem:slope_radar_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai

server:
  error:
    include-message: always
