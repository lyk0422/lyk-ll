spring:
  application:
    name: gitcangku1-test
  datasource:
    url: jdbc:h2:mem:tunnel_dimming_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 0

dimming:
  min-level: 0
  max-level: 5
  floor-level: 1
  accident-level: 5
  brightness-threshold-lux: 500.0
  stability-minutes: 10
  transition-minutes: 2
  traffic-window-minutes: 5
  power-per-level-kw: 0.1
