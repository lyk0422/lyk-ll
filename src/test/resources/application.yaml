spring:
  application:
    name: gitcangku1-test
  datasource:
    # 测试专用独立 H2 内存库（MySQL 兼容模式）；不设置 DB_CLOSE_DELAY，
    # 连接池随测试上下文关闭后数据库即释放。
    url: jdbc:h2:mem:costmap_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 0
