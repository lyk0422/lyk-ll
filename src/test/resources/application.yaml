spring:
  datasource:
    # 测试使用独立命名的内存库，与本地演示库隔离；场景间清空全部业务表。
    url: jdbc:h2:mem:station_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      # 并发用例存在真实行锁等待，放宽锁超时避免误报。
      connection-init-sql: "SET LOCK_TIMEOUT 10000"
  sql:
    init:
      mode: embedded
      schema-locations: classpath:schema.sql

app:
  sample-data:
    enabled: false
