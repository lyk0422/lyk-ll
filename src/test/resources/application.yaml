spring:
  datasource:
    # 测试使用独立的命名内存库（MySQL 兼容模式），与本地运行库隔离；
    # LOCK_TIMEOUT 放大行锁等待，覆盖真实并发事务测试。
    url: jdbc:h2:mem:coldchain_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
