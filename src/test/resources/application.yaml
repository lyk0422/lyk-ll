spring:
  application:
    name: gitcangku1-test
  datasource:
    # 测试专用独立命名内存库，与本地运行库隔离；连接池随测试上下文关闭后数据库即释放
    url: "jdbc:h2:mem:test_invoice;MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
