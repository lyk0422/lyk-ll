spring:
  datasource:
    # 测试使用独立命名的 H2 内存库（MySQL 兼容），随 JVM 退出释放；LOCK_TIMEOUT 保证并发行锁等待
    url: jdbc:h2:mem:rail_possession_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
