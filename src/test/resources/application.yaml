spring:
  application:
    name: gitcangku1-test
  datasource:
    url: jdbc:h2:mem:test_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: UTC

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
