spring:
  application:
    name: gitcangku1-test
  datasource:
    # 测试专用命名内存库（MySQL 兼容模式），与本地运行库隔离；
    # LOCK_TIMEOUT 放宽以容纳并发测试中的锁等待。
    url: jdbc:h2:mem:spectrum_lease_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 16
      minimum-idle: 1
      connection-timeout: 10000
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 0

spectrum:
  shared-eirp-limit-mw: 1000.0
