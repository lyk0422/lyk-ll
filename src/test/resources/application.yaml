spring:
  datasource:
    url: jdbc:h2:mem:ride_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 10000
  sql:
    init:
      mode: always
  main:
    allow-bean-definition-overriding: true
