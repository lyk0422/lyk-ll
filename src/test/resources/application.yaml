spring:
  application:
    name: gitcangku1-test
  datasource:
    url: jdbc:h2:mem:portability_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  error:
    include-message: never
    include-stacktrace: never
