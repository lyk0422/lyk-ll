spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:battery_swap_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      connection-timeout: 30000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC

battery:
  ledger:
    soc-threshold: 90
    health-threshold: 80
    transfer-timeout-hours: 24
