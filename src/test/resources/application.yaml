spring:
  application:
    name: seed-certification-test
  datasource:
    # 测试专用命名内存库（MySQL 兼容模式），与本地运行库隔离
    url: jdbc:h2:mem:seed_cert_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      connection-timeout: 30000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC
