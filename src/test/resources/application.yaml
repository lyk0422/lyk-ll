spring:
  datasource:
    # 测试使用独立命名的 H2 内存库（MySQL 兼容模式），无需外部数据库
    url: jdbc:h2:mem:calib_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: always
      platform: h2
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai

calibration:
  orthogonality-tolerance: 1.0E-4
