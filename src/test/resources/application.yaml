spring:
  datasource:
    # 测试使用独立命名内存库（MySQL 兼容），与本地演示库 tailings_demo 隔离；JVM 退出即释放
    url: jdbc:h2:mem:tailings_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      encoding: UTF-8

flood-control:
  sign-timeout-minutes: 15
  receipt-deviation-ratio: 0.10
