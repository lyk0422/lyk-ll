spring:
  application:
    name: gitcangku1-test
  datasource:
    # 测试使用独立命名的 H2 内存库，与本地运行库隔离；用例间清理数据，避免顺序依赖。
    # 连接池放宽以支持并发用例，行锁等待放宽以容忍并发唯一键冲突的短暂阻塞。
    url: "jdbc:h2:mem:irrigation_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000"
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 16
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 0
