spring:
  application:
    name: gitcangku1-test
  datasource:
    url: jdbc:h2:mem:sensor_sync_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 0

sync:
  lateness-ms: 500
  window-ms:
    LIDAR: 50
    RADAR: 60
    CAMERA: 40
    IMU: 20
  interpolation-window-ms:
    LIDAR: 100
    RADAR: 120
    CAMERA: 80
    IMU: 40
