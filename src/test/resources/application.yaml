spring:
  datasource:
    # 测试使用独立命名内存库，与本地运行库隔离；MySQL 兼容模式，随 JVM 退出丢失
    url: jdbc:h2:mem:rosbag_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8

# 测试中使用小分段，便于验证跨分段滚动与查询
bag:
  segment:
    max-size: 3
