spring:
  datasource:
    # 测试使用独立命名内存库；每个测试场景前清空数据，避免顺序依赖。
    url: jdbc:h2:mem:marpol_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC
