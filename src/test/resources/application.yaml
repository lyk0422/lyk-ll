spring:
  datasource:
    # 测试专用命名内存库（MySQL 兼容模式），与本地运行库隔离；JVM 退出后数据丢失。
    url: jdbc:h2:mem:slaughter_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 3000
  sql:
    init:
      mode: embedded
  jackson:
    time-zone: UTC

server:
  port: 0
