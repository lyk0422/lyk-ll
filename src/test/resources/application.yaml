spring:
  datasource:
    # 测试专用命名内存库（MySQL 兼容模式），与本地运行库隔离；JVM 退出后数据丢失。
    url: jdbc:h2:mem:cosmetic_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8

cosmetic:
  publicity-finalizer:
    # 测试关闭定时任务，公示期满通过显式调用触发，保证时钟可控。
    enabled: false
