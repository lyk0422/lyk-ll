spring:
  datasource:
    url: jdbc:h2:mem:aerospace_torque_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  jackson:
    time-zone: UTC
