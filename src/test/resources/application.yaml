spring:
  datasource:
    # 测试使用独立命名的 H2 内存库（MySQL 兼容模式），与本地运行库隔离
    url: jdbc:h2:mem:rebate_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: UTC

server:
  error:
    include-message: always
