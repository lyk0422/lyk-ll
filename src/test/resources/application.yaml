spring:
  datasource:
    # 测试使用独立命名内存库，与本地运行库隔离；场景间在 @BeforeEach 清理业务表
    url: jdbc:h2:mem:test_gas_custody;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
