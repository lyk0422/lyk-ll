spring:
  datasource:
    # 测试使用独立命名内存库，与本地运行库隔离；JVM 退出后数据消失。
    url: jdbc:h2:mem:lot_genealogy_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
