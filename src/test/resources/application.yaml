spring:
  application:
    name: tunnel-lighting-test
  datasource:
    # 测试默认库；各测试类以独立命名内存库隔离，避免顺序依赖
    url: jdbc:h2:mem:tunnel_lighting_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
