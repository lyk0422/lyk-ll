# 测试使用独立命名内存库（MySQL 兼容模式），与本地运行库隔离；随 JVM 退出释放。
spring:
  datasource:
    url: jdbc:h2:mem:perception_track_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: embedded
      encoding: UTF-8
