spring:
  application:
    name: blood-component-release
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 本地默认使用嵌入式 H2（MySQL 兼容模式）；如需外部 MySQL 可通过 DB_URL/DB_USER 覆盖
    url: ${DB_URL:jdbc:h2:mem:blood_release;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      # 内嵌 H2 启动时自动建表；外部 MySQL 假定由运维侧建表，不执行 H2 方言脚本
      mode: embedded
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
