spring:
  application:
    name: sensor-sync
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    url: ${DB_URL:jdbc:h2:mem:sensor_sync;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sensor:
  sync:
    # 各传感器配对窗口与迟到容忍，单位均为纳秒
    windows:
      lidar:
        window-nanos: 50000000
        lateness-nanos: 100000000
        max-interpolation-gap-nanos: 0
      radar:
        window-nanos: 50000000
        lateness-nanos: 100000000
        max-interpolation-gap-nanos: 200000000
      camera:
        window-nanos: 60000000
        lateness-nanos: 120000000
        max-interpolation-gap-nanos: 0
      imu:
        window-nanos: 10000000
        lateness-nanos: 50000000
        max-interpolation-gap-nanos: 40000000
