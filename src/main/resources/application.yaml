spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 本地默认使用嵌入式 H2（MySQL 兼容模式），数据仅在 JVM 生命周期内保留；
    # 如需连接外部 MySQL，可通过 DB_URL / DB_USER / DB_PASSWORD 环境变量覆盖。
    url: ${DB_URL:jdbc:h2:mem:roaming_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      # 默认加载 schema-h2.sql / data-h2.sql；若通过 DB_URL 切换外部 MySQL，
      # 可将 SQL_INIT_PLATFORM 覆盖为对应平台并自行提供 dialect 脚本。
      platform: ${SQL_INIT_PLATFORM:h2}
      encoding: UTF-8
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
