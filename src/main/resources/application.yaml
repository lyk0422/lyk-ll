slam:
  loop:
    # 默认回环可信度阈值；版本化覆盖见 version-overrides（键为来源数据版本号）。
    score-min: 0.75
    residual-max: 0.5
    covariance-trace-max: 1.0
    version-overrides: {}
  opt:
    # 优化工作线程数；优化器确定性，线程数不影响结果内容，仅影响完成顺序。
    concurrency: 2

spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 默认使用嵌入式 H2（MODE=MySQL 命名内存库）；仍可通过 DB_URL/DB_USER/DB_PASSWORD 覆盖为外部库。
    url: ${DB_URL:jdbc:h2:mem:slam_pose_graph;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      # 仅嵌入式库（H2）自动执行 schema.sql；外部 MySQL 不由本工程自动建表。
      mode: embedded
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
