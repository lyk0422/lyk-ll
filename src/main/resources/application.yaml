spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 默认本地入口：内嵌 H2，开启 MySQL 兼容模式，进程退出后数据不保留；
    # 兼容历史部署：显式提供 DB_URL（如 MySQL）时仍按外部数据库连接。
    url: ${DB_URL:jdbc:h2:mem:robot_compiler;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

robot:
  compiler:
    # 受控工作目录：入口 Xacro 及其全部传递依赖必须位于该目录内
    workspace-root: ${ROBOT_WORKSPACE:robot-workspace}

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
