spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 默认使用工作目录下的嵌入式 H2 文件库（MySQL 兼容模式），支持跨进程恢复；
    # 仍可通过 DB_URL/DB_USER/DB_PASSWORD/DB_DRIVER 环境变量切换到外部 MySQL。
    url: ${DB_URL:jdbc:h2:file:./data/forwarder;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# micro-ROS 边缘离线转发器配置
forwarder:
  # 全局待发 + in-flight 容量上限，超出时按策略驱逐或拒绝
  capacity: 1000
  # in-flight 超时（秒），超时未确认的消息回到 PENDING 允许重试
  in-flight-timeout-seconds: 30
  # 上游合成适配器抖动：0~1 的发送失败概率，模拟网络抖动
  upstream-failure-rate: 0.0
  # 是否默认在线；离线时按 Topic 策略缓存或丢弃
  network-online: true
  # Topic 缓存策略：DROP / LATEST / FIFO / BOUNDED(n)，未配置的 Topic 使用 default-policy
  default-policy: FIFO
  topic-policies:
    # 示例：rosout: "LATEST"
    # 示例：cmd_vel: "BOUNDED(10)"
