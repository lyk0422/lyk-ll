spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 本地默认使用嵌入式 H2（MySQL 兼容模式），数据仅在 JVM 生命周期内保留；
    # compose 部署时通过 DB_URL 指向 MySQL，驱动按 URL 自动探测。
    url: ${DB_URL:jdbc:h2:mem:tf2_cache;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# TF2 风格变换缓存配置
tf2:
  cache:
    # 动态样本保留窗口（纳秒）：早于“最新样本时间戳 - 窗口”的历史样本会被淘汰
    window-nanos: 10000000000
