spring:
  application:
    name: micro-ros-offline-forwarder
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 本题默认且受测试验证的入口：工作目录下嵌入式 H2 文件库（MODE=MySQL），无需外部数据库。
    # 说明：schema.sql 的 DDL（COMMENT ON、CLOB 等）面向 H2；历史 compose 的 MySQL 入口
    # 不在本题交付契约内，若改用 MySQL 需另行提供 MySQL 方言建表脚本。
    url: ${DB_URL:jdbc:h2:file:${forwarder.data-dir:./data}/forwarderdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

forwarder:
  # H2 文件库与运行数据所在目录（相对路径相对于进程工作目录）
  data-dir: ./data
  # 待发队列总容量（条数），0 或负数表示不限
  queue-capacity: 200000
  # in-flight 超时（毫秒），超时未 ACK 的消息可重新投递
  inflight-timeout-ms: 30000
  # 调度扫描间隔（毫秒）
  dispatch-interval-ms: 500
