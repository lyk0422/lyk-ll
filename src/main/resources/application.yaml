spring:
  application:
    name: fishery-quota
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 默认嵌入式 H2（MySQL 兼容模式），数据仅在 JVM 生命周期内保留；可用 DB_URL/DB_USER/DB_PASSWORD 覆盖。
    url: ${DB_URL:jdbc:h2:mem:fishery_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
