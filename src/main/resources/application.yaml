spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 默认使用嵌入式 H2（MySQL 兼容模式），可通过 DB_URL/DB_USER/DB_PASSWORD/DB_DRIVER 覆盖为外部数据库
    url: ${DB_URL:jdbc:h2:mem:forestry_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:/schema.sql
      data-locations: classpath:/data.sql
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

forestry:
  # 列入限批名单的时长（天），期限内该经营主体新申请一律拒绝
  blacklist-days: 365
  # 发证后采伐期限（自然日，UTC 日界）
  harvest-window-days: 90
  # 更新验收合格率下限（百分比），恰达该值视为合格
  acceptance-pass-rate: 85
