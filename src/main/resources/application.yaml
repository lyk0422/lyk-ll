spring:
  application:
    name: rosbridge-gateway
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    url: ${DB_URL:jdbc:h2:mem:rosbridge_gateway;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: embedded
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

rosbridge:
  # 最后一个客户端取消订阅或断连后，上游订阅保留的宽限期（毫秒）；期内重连/重订可复用
  grace-period-ms: 2000
  # Service 调用默认超时（毫秒）
  service-timeout-ms: 5000
  # 每客户端默认发送速率上限（消息/秒）
  default-rate-per-second: 100
  # 每客户端默认发送队列上限（条）
  default-queue-capacity: 256
  # 每个共享订阅在 JVM 内保留用于重连补发的最近消息条数
  ledger-capacity: 1024
  # 合成 ROS 适配器的演示 Topic 发布周期（毫秒），<=0 表示不自动发布
  synthetic-tick-interval-ms: 1000
