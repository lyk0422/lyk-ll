spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 默认使用嵌入式 H2（MySQL 兼容模式），数据仅保留在 JVM 生命周期内；
    # 可通过 DB_URL/DB_USER 环境变量覆盖为外部数据库。
    url: ${DB_URL:jdbc:h2:mem:autoware_route;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      # schema.sql 以 UTF-8 保存（含中文注释）；嵌入式 H2 启动时自动建表
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
