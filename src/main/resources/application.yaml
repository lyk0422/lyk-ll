spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 默认使用嵌入式 H2（MySQL 兼容模式），仅在 JVM 生命周期内保留数据；
    # 如显式提供 DB_URL（例如 MySQL），则以外部配置为准。
    url: ${DB_URL:jdbc:h2:mem:spectrum_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 频谱租约协调业务配置：共享模式下单位区域/时间/频率片段的 EIRP 上限（单位 mW）
spectrum:
  lease:
    shared-eirp-limit-mw: 1000
