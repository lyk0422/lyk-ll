spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 本地默认使用嵌入式 H2（MySQL 兼容模式），无需外部数据库；
    # 可通过 DB_URL/DB_USER/DB_PASSWORD/DB_DRIVER 环境变量切换到 MySQL。
    url: ${DB_URL:jdbc:h2:mem:carbon_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

carbon:
  compliance:
    # 履约截止时刻（UTC）：恰在该时刻到达的申请仍受理，之后一律拒绝；
    # 到达后系统自动将未足额清缴企业标记为“未履约”。
    deadline: ${CARBON_DEADLINE:2026-12-31T16:00:00Z}
