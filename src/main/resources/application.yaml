spring:
  application:
    name: seed-certification
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 默认使用嵌入式 H2（MySQL 兼容模式），数据仅在 JVM 生命周期内保留；
    # 如需外部库，可通过 DB_URL/DB_USER/DB_PASSWORD/DB_DRIVER 环境变量覆盖。
    url: ${DB_URL:jdbc:h2:mem:seed_cert;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    # 嵌入式 H2 启动时自动建表并写入合成主数据；外部库（如 MySQL）不由脚本初始化
    init:
      mode: embedded
      encoding: UTF-8
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
