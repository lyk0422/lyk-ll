spring:
  application:
    name: ros-param-center
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 本地默认使用 H2(MODE=MySQL) 命名内存库，无需外部数据库；
    # 生产可用 DB_URL/DB_USER/DB_PASSWORD 覆盖为 MySQL。
    url: ${DB_URL:jdbc:h2:mem:ros_param_center;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ROS 节点适配器默认校验超时（毫秒），请求中可携带 nodeTimeoutMs 覆盖
ros:
  node:
    timeout-ms: 2000
