spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 本地默认使用嵌入式 H2（MySQL 兼容模式），仅在 JVM 生命周期内保留数据；
    # 如需外部 MySQL，可通过 DB_URL / DB_USER / DB_PASSWORD 覆盖。
    url: ${DB_URL:jdbc:h2:mem:marpol;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

marpol:
  # 垃圾排放距最近陆地的最小距离（海里），恰 12 海里合法
  garbage-min-distance-nm: 12
  # 缺陷整改期限：核查日 +14 个自然日（UTC 日界），恰第 14 日关闭有效
  rectify-days: 14
