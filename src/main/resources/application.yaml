spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  # 本地默认 local profile：嵌入式 H2 + 自动建表与合成种子；
  # 接入外部 MySQL 时设置 SPRING_PROFILES_ACTIVE（非 local）并提供 DB_URL/DB_USER/DB_PASSWORD。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
